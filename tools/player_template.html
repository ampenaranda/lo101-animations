<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Learning Online 101 animation</title>
<style>
  /* LO 101 moment player v3 (Nov 9, 2026): words + numbered steps + dashed lines to what each step means, all drawn in code. */
  :root { --ink:#174A5D; --acc:#319EAE; }
  html, body { margin:0; height:100%; background:transparent; overflow:hidden; }
  .card { position:relative; width:100%; height:100%; border-radius:16px; overflow:hidden; font-family:Georgia, "Times New Roman", serif; color:var(--ink); }
  video { position:absolute; display:block; transition:opacity .35s ease; }
  .wide video { right:0; top:0; height:100%; width:auto; aspect-ratio:16/9;
                -webkit-mask-image:linear-gradient(to right, transparent 0, #000 9%); mask-image:linear-gradient(to right, transparent 0, #000 9%); }
  .phone video { left:0; top:0; width:100%; height:auto; aspect-ratio:16/9; }
  video.fade { opacity:0; }
  svg.lines { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:1; overflow:visible; }
  svg.lines path { fill:none; stroke-dasharray:6 6; stroke-linecap:round; }
  svg.lines path.halo { stroke:#FFFFFF; stroke-width:5; stroke-opacity:.85; }
  svg.lines path.ink { stroke:var(--ink); stroke-width:2; }
  svg.lines circle.ring { fill:#FFFFFF; stroke:var(--ink); stroke-width:2; }
  svg.lines text { font:700 11px Georgia, serif; fill:var(--ink); text-anchor:middle; dominant-baseline:central; }
  .words { position:absolute; display:flex; flex-direction:column; gap:.45em; z-index:2; }
  .wide .words { left:4%; top:0; bottom:0; width:42%; justify-content:center; font-size:clamp(14px, 2.2vw, 22px); }
  .phone .words { left:5%; right:5%; top:calc(56.25vw + 10px); font-size:clamp(14px, 4.2vw, 22px); gap:.35em; }
  .head { display:flex; align-items:center; gap:.55em; margin-bottom:.2em; }
  .emb { width:2.4em; height:2.4em; border-radius:50%; background:var(--acc); display:grid; place-items:center; flex:none; }
  .emb svg { width:62%; height:62%; fill:#FFFFFF; }
  .emb.dark svg { fill:var(--ink); }
  .tag { font-weight:700; font-size:.86em; line-height:1.2; text-wrap:balance; }
  .pill { align-self:flex-start; display:flex; align-items:center; gap:.45em; background:#FFFFFF; border:1.5px solid var(--ink); border-radius:999px;
          padding:.22em .8em .22em .28em; font-weight:700; line-height:1.15; opacity:0; transform:translateX(-.4em); transition:opacity .4s ease, transform .4s ease; }
  .pill.on { opacity:1; transform:none; }
  .num { width:1.45em; height:1.45em; border-radius:50%; background:var(--acc); color:#FFFFFF; display:grid; place-items:center; font-size:.85em; flex:none; }
  .num.dark { color:var(--ink); }
  .sum { font-size:.86em; line-height:1.35; margin-top:.25em; opacity:0; transition:opacity .5s ease; max-width:18em; text-wrap:balance; }
  .sum.on { opacity:1; }
  button { position:absolute; right:12px; bottom:12px; width:48px; height:48px; border-radius:50%; border:2px solid var(--ink); background:#FFFFFF; color:var(--ink);
           cursor:pointer; display:grid; place-items:center; padding:0; box-shadow:0 2px 6px rgba(0,0,0,.25); z-index:3; }
  .phone button { top:12px; bottom:auto; }
  button:focus-visible { outline:3px solid var(--ink); outline-offset:3px; }
  button svg { width:22px; height:22px; fill:currentColor; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  @media (prefers-reduced-motion: reduce) { .pill, .sum, video { transition:none; } }
</style>
</head>
<body>
<div class="card" id="c">
  <video id="v" muted playsinline preload="auto"></video>
  <svg class="lines" id="L" aria-hidden="true"></svg>
  <div class="words" id="w" aria-hidden="true"></div>
  <button id="b" type="button" aria-pressed="false"></button>
  <p class="sr" id="d"></p>
</div>
<script>
const M = /*DATA*/{};
const PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
const PAUSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';
const q = new URLSearchParams(location.search);
const key = (q.get("m") || "W").replace(/[^A-Z0-9]/gi, "").toUpperCase(); const id = M[key] ? key : "W"; const S = M[id];
const layout = q.get("layout") === "phone" ? "phone" : "wide";
const c = document.getElementById("c"), v = document.getElementById("v"), b = document.getElementById("b"), w = document.getElementById("w"), L = document.getElementById("L");
const light = ["#C9CF4E", "#E79BC6", "#94AE7E"].includes(S.acc);
c.classList.add(layout); c.style.setProperty("--acc", S.acc); c.style.background = S.bg;
v.src = "vid/" + id + ".mp4"; v.poster = "img/" + id + ".jpg"; v.setAttribute("aria-label", "Animation: " + S.alt);
document.getElementById("d").textContent = "Animation: " + S.alt + ". On screen: " + S.steps.map((s, i) => (i + 1) + ". " + s[1] + ".").join(" ") + " " + S.sum;
w.innerHTML = `<div class="head"><span class="emb${light ? " dark" : ""}"><svg viewBox="0 0 512 512">${S.svg}</svg></span><span class="tag">${S.tag}</span></div>`
  + S.steps.map((s, i) => `<div class="pill"><span class="num${light ? " dark" : ""}">${i + 1}</span>${s[1]}</div>`).join("") + `<div class="sum">${S.sum}</div>`;
const pills = [...w.querySelectorAll(".pill")], sum = w.querySelector(".sum");
const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const DRAW = 0.7, SUMT = S.steps[S.steps.length - 1][0] + 1.0;
function target(s) {   // % of the video frame -> card pixels
  const cr = c.getBoundingClientRect(), vr = v.getBoundingClientRect();
  return [vr.left - cr.left + vr.width * s[2] / 100, vr.top - cr.top + vr.height * s[3] / 100];
}
function anchor(p) { const cr = c.getBoundingClientRect(), r = p.getBoundingClientRect();
  return layout === "wide" ? [r.right - cr.left + 6, r.top - cr.top + r.height / 2] : [r.left - cr.left + r.width / 2 + 10, r.top - cr.top - 4]; }
function curve(a, z) { const mx = (a[0] + z[0]) / 2, my = Math.min(a[1], z[1]) - 18;
  return t => { const u = 1 - t; return [u*u*a[0] + 2*u*t*mx + t*t*z[0], u*u*a[1] + 2*u*t*my + t*t*z[1]]; }; }
function draw(t) {   // only the current step's line and marker; it fades when the next step starts (no clutter, no stale targets)
  let out = ""; const last = S.steps.length - 1;
  S.steps.forEach((s, i) => {
    pills[i].classList.toggle("on", reduce || t >= s[0]);
    const nextT = i < last ? S.steps[i + 1][0] : Infinity;
    let a = reduce ? (i === last ? 1 : 0) : (t < s[0] ? 0 : t < nextT ? 1 : Math.max(0, 1 - (t - nextT) / 0.3));
    if (a <= 0) return;
    const p = reduce ? 1 : Math.max(0, Math.min(1, (t - s[0]) / DRAW)), z = target(s);
    let g = `<g opacity="${a.toFixed(2)}">`;
    if (layout === "wide" && s[4]) {   // a line only where the target is not obvious (Ana)
      const f = curve(anchor(pills[i]), z), n = 40, pts = [];
      for (let k = 0; k <= n * p; k++) pts.push(f(k / n));
      const d = "M" + pts.map(q => q[0].toFixed(1) + "," + q[1].toFixed(1)).join(" L");
      g += `<path class="halo" d="${d}"/><path class="ink" d="${d}"/>`;
    }
    if (p >= 1 || layout === "phone" || !s[4]) g += `<circle class="ring" cx="${z[0].toFixed(1)}" cy="${z[1].toFixed(1)}" r="10"/><text x="${z[0].toFixed(1)}" y="${(z[1] + .5).toFixed(1)}">${i + 1}</text>`;
    out += g + "</g>";
  });
  L.innerHTML = out; sum.classList.toggle("on", reduce || t >= SUMT);
}
let playing = false, hold = null;
function tick() { draw(v.currentTime); requestAnimationFrame(tick); } requestAnimationFrame(tick);
function setBtn() { b.innerHTML = playing ? PAUSE : PLAY; b.setAttribute("aria-label", playing ? "Pause animation" : "Play animation"); b.setAttribute("aria-pressed", playing ? "false" : "true"); }
function play() { playing = true; setBtn(); v.play().catch(() => { playing = false; setBtn(); }); }
function pause() { playing = false; setBtn(); clearTimeout(hold); hold = null; v.classList.remove("fade"); v.pause(); }
v.addEventListener("ended", () => { if (!playing) return;
  hold = setTimeout(() => { v.classList.add("fade"); hold = setTimeout(() => { v.currentTime = 0; v.classList.remove("fade"); if (playing) v.play(); }, 350); }, 2200); });
b.addEventListener("click", () => (playing ? pause() : play()));
setBtn(); if (!reduce) play();
</script>
</body>
</html>
